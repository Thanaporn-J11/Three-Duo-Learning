sonar.projectKey=threeduo-app
sonar.projectName=ThreeDuo Learning (Flutter)
sonar.sourceEncoding=UTF-8

# Dart code (the plugin also reads pubspec.yaml) and the Flutter tests
sonar.sources=lib,pubspec.yaml
sonar.tests=test
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,build/**,.dart_tool/**,android/**,ios/**,linux/**,macos/**,windows/**,web/**,lib/screens/tale/*/**

# Produced by: flutter test --machine --coverage > tests.output
sonar.flutter.tests.reportPath=tests.output
sonar.flutter.coverage.reportPath=coverage/lcov.info

# The plugin runs the analyzer itself (flutter analyze). Keep our analysis_options.yaml:
# commit before the first scan and check "git status" afterwards.
sonar.dart.analyzer.options.override=false
